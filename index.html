<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>スマートスケジュール帳</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --accent-color: #4338ca;
      --bg-color: #ffffff;
      --bg-sub: #f6f7fb;
      --text-main: #111827;
      --text-sub: #6b7280;
      --line: #e5e7eb;
      --alert-red: #dc2626;
      --alert-yellow: #d97706;
      --alert-green: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .app-container {
      max-width: 414px;
      margin: 0 auto;
      padding-bottom: calc(160px + env(safe-area-inset-bottom)); /* タブバーと＋ボタンに隠れないように */
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ========== タブ1：リスト（案A） ========== */
    .list-wrap { padding: calc(24px + env(safe-area-inset-top)) 24px 0; }

    .date-label { font-size: 13px; color: var(--text-sub); letter-spacing: 0.04em; }
    .page-title { font-size: 22px; font-weight: 700; margin-top: 2px; }

    .label { font-size: 12px; color: var(--text-sub); font-weight: 600; letter-spacing: 0.08em; }

    .job-section { margin-top: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .job-main { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
    .job-status-large { font-size: 44px; font-weight: 800; color: var(--primary-color); line-height: 1; }
    .job-status-large.none { color: #9ca3af; }
    .job-time { font-size: 22px; font-weight: 700; }
    .job-name { font-size: 13px; color: var(--text-sub); margin-top: 6px; }
    .tomorrow-row { display: flex; justify-content: space-between; margin-top: 14px; font-size: 14px; color: var(--text-sub); }
    .tomorrow-row b { color: var(--text-main); }

    .summary { display: flex; gap: 28px; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .stat-num { font-size: 26px; font-weight: 800; }
    .stat-num small { font-size: 13px; font-weight: 600; margin-left: 2px; }
    .stat-label { font-size: 12px; color: var(--text-sub); margin-top: 2px; }

    .list-head { margin-top: 22px; margin-bottom: 2px; }

    .task-row { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid #f3f4f6; }
    .task-body { flex: 1; min-width: 0; }
    .task-name { font-size: 15px; font-weight: 700; word-break: break-all; }
    .task-detail { font-size: 12px; color: var(--text-sub); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-meta { font-size: 12px; color: var(--text-sub); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
    .task-side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .count-num { font-size: 17px; font-weight: 800; white-space: nowrap; }
    .count-unit { font-size: 11px; color: var(--text-sub); }
    .c-red { color: var(--alert-red); }
    .c-yellow { color: var(--alert-yellow); }
    .c-green { color: var(--alert-green); }
    .bg-red { background: var(--alert-red); }
    .bg-yellow { background: var(--alert-yellow); }
    .bg-green { background: var(--alert-green); }

    .task-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #d1d5db;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      display: grid;
      place-content: center;
    }
    .task-checkbox:checked { background: var(--alert-green); border-color: var(--alert-green); }
    .task-checkbox:checked::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 800; }

    .delete-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 0 2px 6px;
    }
    .delete-btn:hover { color: var(--alert-red); }

    .empty-message { text-align: center; color: var(--text-sub); font-size: 14px; padding: 28px 0; }

    .completed-section { margin-top: 14px; }
    .completed-section summary { font-size: 13px; color: #9ca3af; cursor: pointer; font-weight: 600; list-style: none; }
    .completed-section summary::-webkit-details-marker { display: none; }
    .completed-section summary::before { content: "› "; }
    .completed-section[open] summary::before { content: "⌄ "; }
    .job-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; }
    .job-row-date { font-weight: 700; white-space: nowrap; }
    .job-row-name { flex: 1; min-width: 0; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job-row .delete-btn { font-size: 15px; }

    .completed-row { opacity: 0.6; }
    .completed-row .task-name { text-decoration: line-through; }
    .completed-meta { font-size: 11px; color: var(--text-sub); margin-top: 3px; }

    /* ========== タブ2：タイムライン（案C） ========== */
    .tl-head { background: #fff; padding: calc(24px + env(safe-area-inset-top)) 20px 14px; border-bottom: 1px solid var(--line); }
    .tl-date { font-size: 20px; font-weight: 800; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .pill { font-size: 12px; font-weight: 700; padding: 7px 10px; border-radius: 999px; white-space: nowrap; }
    .pill-job { background: var(--primary-color); color: #fff; }
    .pill-none { background: #f1f5f9; color: #64748b; }
    .pill-sum { background: #eef2ff; color: var(--accent-color); }

    #tab-timeline { background: var(--bg-sub); min-height: 100vh; }
    .tl-body { padding: 16px 20px 0; }
    .tl-title { font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 12px; display: flex; justify-content: space-between; }
    .tl-title span:last-child { color: var(--accent-color); }

    .tl-grid { position: relative; }
    .tl-hour { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #9ca3af; transform: translateY(-50%); }
    .tl-hour::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
    .tl-hour span { width: 38px; }

    .tl-block { position: absolute; left: 46px; right: 0; border-radius: 12px; padding: 7px 12px; font-size: 11px; overflow: hidden; }
    .tl-block b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tl-block.compact { padding: 2px 12px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .tl-block.compact b { display: inline; font-size: 12px; }
    .b-job { background: var(--primary-color); color: #fff; }
    .b-red { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }
    .b-yellow { background: #fef3c7; color: #92400e; border-left: 4px solid #f59e0b; }
    .b-green { background: #d1fae5; color: #065f46; border-left: 4px solid #10b981; }
    .b-move { background: repeating-linear-gradient(135deg, #f8fafc, #f8fafc 6px, #eef2f7 6px, #eef2f7 12px); color: #94a3b8; border: 1px dashed #cbd5e1; }

    .tl-now { position: absolute; left: 40px; right: 0; border-top: 2px solid #ef4444; z-index: 2; }
    .tl-now::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .tl-now span { position: absolute; right: 0; top: -17px; font-size: 10px; font-weight: 700; color: #ef4444; background: var(--bg-sub); padding-left: 4px; }
    .tl-deadline { position: absolute; left: 46px; right: 0; border-top: 2px dotted #ef4444; z-index: 1; }
    .tl-deadline span { position: absolute; right: 0; top: 2px; font-size: 10px; font-weight: 700; color: #ef4444; }

    .tl-card { margin: 18px 20px 0; background: #fff; border-radius: 14px; padding: 12px 14px; border: 1px solid var(--line); }
    .tl-card-title { font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
    .tl-card-title.warn { color: var(--alert-red); }
    .tl-card-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 4px 0; }
    .tl-card-row span:last-child { font-weight: 700; white-space: nowrap; }

    /* ========== 下部タブバー・追加ボタン ========== */
    .tab-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      display: flex; justify-content: center;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-bar-inner { display: flex; width: 100%; max-width: 414px; }
    .tab-btn {
      flex: 1; border: none; background: none; cursor: pointer;
      padding: 10px 0 12px; font-size: 11px; font-weight: 700; color: #9ca3af;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .tab-btn .tab-icon { font-size: 20px; filter: grayscale(1); opacity: 0.6; }
    .tab-btn.active { color: var(--text-main); }
    .tab-btn.active .tab-icon { filter: none; opacity: 1; }

    .fab {
      position: fixed; z-index: 11;
      right: max(24px, calc(50vw - 207px + 24px));
      bottom: calc(80px + env(safe-area-inset-bottom));
      width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--text-main); color: #fff; font-size: 30px; font-weight: 300; line-height: 1;
      box-shadow: 0 8px 20px rgba(17, 24, 39, 0.25);
    }

    /* ========== 追加フォーム（ボトムシート） ========== */
    .sheet-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35); z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .sheet-overlay.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
      max-width: 414px; margin: 0 auto; max-height: 88vh; overflow-y: auto;
      background: #fff; border-radius: 20px 20px 0 0;
      padding: 18px 20px calc(24px + env(safe-area-inset-bottom));
      transform: translateY(100%); transition: transform 0.25s ease;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .sheet-head span { font-size: 17px; font-weight: 800; }
    .sheet-close { border: none; background: #f1f5f9; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 14px; color: #475569; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .form-group label { font-size: 13px; font-weight: 600; color: var(--text-sub); }
    .form-control { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; background: #fff; }
    textarea.form-control { resize: vertical; }
    .btn-submit { width: 100%; background: var(--text-main); color: #fff; border: none; padding: 13px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .btn-submit:disabled { opacity: 0.6; }

    .api-settings { margin-top: 14px; border-top: 1px dashed #cbd5e1; padding-top: 12px; }
    .api-settings summary { font-size: 12px; color: var(--text-sub); cursor: pointer; font-weight: 600; }
    .btn-clear { background: #e2e8f0; color: #334155; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

    /* 通知トースト */
    .status-msg {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
      bottom: calc(150px + env(safe-area-inset-bottom));
      width: calc(100% - 48px); max-width: 366px;
      font-size: 13px; font-weight: 600; padding: 10px 14px; border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      display: none;
    }
    .status-msg.info { background: #e0f2fe; color: #0369a1; display: block; }
    .status-msg.error { background: #fee2e2; color: #991b1b; display: block; }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- ===== タブ1：リスト ===== -->
    <main class="tab-panel active" id="tab-list">
      <div class="list-wrap">
        <div class="date-label" id="list-date"></div>
        <div class="page-title">今日の予定</div>

        <!-- ① 今日のバイト（特大表示）／② 明日のバイト -->
        <section class="job-section">
          <div class="label">本日のアルバイト</div>
          <div class="job-main">
            <span class="job-status-large" id="today-job-status">なし</span>
            <span class="job-time" id="today-job-time"></span>
          </div>
          <div class="job-name" id="today-job-name"></div>
          <div class="tomorrow-row"><span>明日のアルバイト</span><b id="tomorrow-job-status">なし</b></div>
          <!-- 今後のアルバイト一覧（削除用・折りたたみ） -->
          <div id="job-list-container"></div>
        </section>

        <!-- 未完了課題の件数・残り合計時間 -->
        <section class="summary">
          <div><div class="stat-num" id="summary-count">0<small>件</small></div><div class="stat-label">未完了の課題</div></div>
          <div><div class="stat-num" id="summary-time">0<small>分</small></div><div class="stat-label">残り作業の合計</div></div>
        </section>

        <!-- ③④ 課題リスト & カウントダウン -->
        <div class="list-head label">課題（優先度順）</div>
        <div id="task-list"></div>

        <!-- 完了済み課題（折りたたみ） -->
        <div id="completed-container"></div>
      </div>
    </main>

    <!-- ===== タブ2：タイムライン ===== -->
    <main class="tab-panel" id="tab-timeline">
      <div class="tl-head">
        <div class="tl-date" id="tl-date"></div>
        <div class="pills" id="tl-pills"></div>
      </div>
      <div class="tl-body">
        <div class="tl-title"><span>今日のタイムライン</span><span>⏱ 自動配置</span></div>
        <div class="tl-grid" id="tl-grid"></div>
      </div>
      <div id="tl-extra"></div>
    </main>
  </div>

  <!-- 追加ボタン -->
  <button class="fab" type="button" onclick="openSheet()" aria-label="予定・課題を追加">＋</button>

  <!-- 下部タブバー -->
  <nav class="tab-bar">
    <div class="tab-bar-inner">
      <button class="tab-btn active" type="button" data-tab="tab-list" onclick="switchTab('tab-list')">
        <span class="tab-icon">📋</span>リスト
      </button>
      <button class="tab-btn" type="button" data-tab="tab-timeline" onclick="switchTab('tab-timeline')">
        <span class="tab-icon">🕒</span>タイムライン
      </button>
    </div>
  </nav>

  <!-- ⑤ 予定追加フォーム（ボトムシート） -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
  <section class="sheet" id="add-sheet" aria-label="予定・課題の追加">
    <div class="sheet-head">
      <span>予定・課題を追加</span>
      <button type="button" class="sheet-close" onclick="closeSheet()" aria-label="閉じる">✕</button>
    </div>
    <form id="add-schedule-form">
      <div class="form-group">
        <label for="task-name">タイトル・件名</label>
        <input type="text" id="task-name" class="form-control" placeholder="例: 知能メディアレポート / カフェ" required>
      </div>

      <div class="form-group">
        <label for="task-type">種別</label>
        <select id="task-type" class="form-control" onchange="toggleJobTimeInput()">
          <option value="task">課題</option>
          <option value="job">アルバイト</option>
        </select>
      </div>

      <div class="form-group" id="detail-group">
        <label for="task-detail">課題の詳細・指示内容</label>
        <textarea id="task-detail" class="form-control" rows="2" placeholder="例: manabaの指示文（2000字程度、参考文献要）"></textarea>
      </div>

      <div class="form-group" id="manual-est-group">
        <label for="task-manual-minutes">所要時間（分） <span style="font-size:0.75rem; font-weight:normal;">※空欄時はAIが自動推測</span></label>
        <input type="number" id="task-manual-minutes" class="form-control" placeholder="例: 90（手動指定する場合）" min="5" step="5">
      </div>

      <div class="form-group">
        <label for="task-datetime" id="datetime-label">日時・締め切り</label>
        <input type="datetime-local" id="task-datetime" class="form-control" required>
      </div>

      <div class="form-group" id="end-time-group" style="display:none;">
        <label for="job-end-time">終了時刻</label>
        <input type="time" id="job-end-time" class="form-control" value="22:00">
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">登録する</button>

      <!-- AI設定エリア（Gemini / Claude の切り替え） -->
      <details class="api-settings" id="api-settings">
        <summary>⚙️ AI設定（所要時間の自動推測）</summary>
        <div class="form-group" style="margin-top: 8px;">
          <label for="ai-provider">使用するAI</label>
          <select id="ai-provider" class="form-control" onchange="changeProvider()">
            <option value="gemini">Gemini（Google・無料枠あり）</option>
            <option value="claude">Claude（Anthropic・従量課金）</option>
          </select>
        </div>
        <div class="form-group" id="claude-model-group" style="display:none;">
          <label for="claude-model">Claudeのモデル</label>
          <select id="claude-model" class="form-control" onchange="saveClaudeModel()">
            <option value="claude-opus-5-5">Claude Opus 5.5（高性能）</option>
            <option value="claude-sonnet-5-5">Claude Sonnet 5.5（バランス）</option>
            <option value="claude-haiku-5-5">Claude Haiku 5.5（最安・高速）</option>
          </select>
        </div>
        <div class="form-group">
          <label for="api-key-input" id="api-key-label">Gemini APIキー</label>
          <input type="text" id="api-key-input" class="form-control" placeholder="APIキーを入力してください" autocomplete="off" onchange="saveApiKey()">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
            <span style="font-size: 0.7rem; color: var(--text-sub);">※入力するとブラウザに保存されます。</span>
            <button type="button" class="btn-clear" onclick="clearApiKey()">保存キーをクリア</button>
          </div>
        </div>
      </details>

      <!-- Googleカレンダー連携（Apps Script 経由でバイト予定を取り込む） -->
      <details class="api-settings" id="gcal-settings">
        <summary>📅 Googleカレンダー連携（バイト予定の取り込み）</summary>
        <div class="form-group" style="margin-top: 8px;">
          <label for="gcal-url">Apps Script のウェブアプリURL</label>
          <input type="url" id="gcal-url" class="form-control" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" onchange="saveGcalUrl()">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px;">
            <span id="gcal-status" style="font-size: 0.7rem; color: var(--text-sub);">未設定</span>
            <button type="button" class="btn-clear" onclick="syncGoogleCalendar(true)">今すぐ同期</button>
          </div>
        </div>
      </details>
    </form>
  </section>

  <div id="status-display" class="status-msg"></div>

  <script>
    const STORAGE_KEY = 'smart_schedule_items';
    const API_KEY_STORAGE = 'smart_schedule_gemini_key';     // Gemini（以前からのキー名をそのまま使う）
    const CLAUDE_KEY_STORAGE = 'smart_schedule_claude_key';
    const AI_PROVIDER_STORAGE = 'smart_schedule_ai_provider';
    const CLAUDE_MODEL_STORAGE = 'smart_schedule_claude_model';
    const GCAL_URL_STORAGE = 'smart_schedule_gcal_url';
    const GCAL_HIDDEN_STORAGE = 'smart_schedule_gcal_hidden';      // アプリ側で削除した取り込み予定
    const GCAL_LAST_SYNC_STORAGE = 'smart_schedule_gcal_last_sync';
    const GCAL_SYNC_INTERVAL_MIN = 30;

    // AIごとの設定（APIキーはAIごとに別々に保存する）
    const AI_PROVIDERS = {
      gemini: { label: 'Gemini', keyStorage: API_KEY_STORAGE, placeholder: 'Gemini APIキー（AIza...）' },
      claude: { label: 'Claude', keyStorage: CLAUDE_KEY_STORAGE, placeholder: 'Claude APIキー（sk-ant-...）' }
    };

    const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
    const DEFAULT_JOB_HOURS = 4;          // 終了時刻が未登録のバイトは4時間とみなす
    const MOVE_BUFFER_MIN = 30;           // バイト前後の移動・休憩時間
    const TASK_GAP_MIN = 10;              // 課題と課題の間の休憩
    const MIN_CHUNK_MIN = 15;             // これより短いスキマには課題を入れない
    const HOUR_PX = 50;                   // タイムライン1時間あたりの高さ

    // Date を datetime-local 形式（ローカル時刻の "YYYY-MM-DDTHH:mm"）に変換
    // ※toISOString() はUTCになるため、日本時間では9時間ずれてしまう
    function toLocalInputValue(date) {
      const pad = n => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    const initialDefaultTasks = [

    // 行動傾向の分析に使う記録項目をそろえる（旧データにも補完する）
    //   createdAt   : 登録日時
    //   completed   : 完了したかどうか
    //   completedAt : 完了日時（未完了なら null）
    function normalizeTask(t) {
      return {
        ...t,
        createdAt: t.createdAt || new Date(t.id > 1e12 ? t.id : Date.now()).toISOString(),
        completed: t.completed === true,
        completedAt: t.completed === true ? (t.completedAt || null) : null
      };
    }

    function loadTasks() {
      const saved = localStorage.getItem(STORAGE_KEY);
      let list = initialDefaultTasks;
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) list = parsed;
        } catch (e) {
          list = initialDefaultTasks;
        }
      }
      return list.map(normalizeTask);
    }

    // 所要時間の推定：手動指定 → 選択中のAI（Gemini / Claude）→ 失敗時は60分
    async function estimateTaskMinutes(name, detail, manualMinutes) {
      if (manualMinutes && !isNaN(parseInt(manualMinutes, 10))) {
        const val = parseInt(manualMinutes, 10);
        showStatus(`所要時間: 手動指定 (${val}分) で登録しました`, "info");
        return val;
      }

      const providerId = currentProvider();
      const provider = AI_PROVIDERS[providerId];
      const apiKey = document.getElementById('api-key-input').value.trim() || localStorage.getItem(provider.keyStorage);
      if (!apiKey) {
        showStatus(`※${provider.label}のAPIキー未設定のためデフォルト値(60分)を適用しました`, "info");
        return 60;
      }

      const contentPrompt = detail ? `【課題名】${name}\n【詳細】${detail}` : `【課題名】${name}`;
      const prompt = `以下の課題内容から、大学生が完了するのに必要な推定作業時間（分単位の数値）を答えてください。説明文や単位は含めず、数字のみを出力してください。\n\n${contentPrompt}`;

      const result = providerId === 'claude'
        ? await estimateWithClaude(apiKey, prompt)
        : await estimateWithGemini(apiKey, prompt);

      if (result.minutes) {
        showStatus(`🤖 AI解析成功 (${result.model}): 推定 ${result.minutes}分`, "info");
        return result.minutes;
      }

      showStatus(`⚠️ ${provider.label}での解析に失敗したため、標準値(60分)で登録しました。${result.error ? `（${result.error}）` : ''}`, "error");
      return 60;
    }

    // AIの返答から最初の数値（分）を取り出す
    function parseMinutes(text) {
      const match = (text || '').match(/\d+/);
      const minutes = match ? parseInt(match[0], 10) : 0;
      return minutes > 0 ? minutes : null;
    }

    // ★Gemini：404・503エラー時に自動で別モデル（2.5-flash / 2.0-flash / flash-latest）へ切り替える
    async function estimateWithGemini(apiKey, prompt) {
      // 試行するモデルの優先順位リスト（404や503発生時に自動切り替え）
      const models = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-flash-latest'];
      let lastError = '';

      for (const model of models) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-goog-api-key': apiKey
            },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });

          // 404(存在しない)・503(混雑)・429(制限) の場合はポップアップを出さず次のモデルを試す
          if (!response.ok) {
            console.warn(`モデル ${model} でエラー (${response.status})。次のモデルへ切り替えます...`);
            lastError = `エラー ${response.status}`;
            continue;
          }

          const data = await response.json();
          const minutes = parseMinutes(data.candidates?.[0]?.content?.parts?.[0]?.text);
          if (minutes) return { minutes, model };
        } catch (err) {
          console.error(`通信エラー (${model}):`, err);
          lastError = '通信エラー';
        }
      }

      return { error: lastError };
    }

    // ★Claude：Messages API をブラウザから直接呼び出す（キーは利用者自身のものをブラウザに保存）
    async function estimateWithClaude(apiKey, prompt) {
      const model = document.getElementById('claude-model').value;
      const headers = {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      };
      const body = {
        model,
        max_tokens: 1024,
        output_config: { effort: 'low' },   // 数値を答えるだけなので考える量は少なめに
        messages: [{ role: 'user', content: prompt }]
      };
      // Opus / Sonnet は、安全判定で回答を断られたときにサーバー側で別モデルへ自動で切り替える
      if (model !== 'claude-haiku-5-5') {
        headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';
        body.fallbacks = 'default';
      }

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers,
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => null);
          console.warn(`Claude APIエラー (${response.status})`, errorData);
          const reason = { 401: 'APIキーが正しくありません', 429: '利用上限に達しました', 529: '混雑しています' }[response.status];
          return { error: reason ? `${reason}・${response.status}` : `エラー ${response.status}` };
        }

        const data = await response.json();
        if (data.stop_reason === 'refusal') {
          console.warn('Claudeが回答を辞退しました', data.stop_details);
          return { error: '回答が辞退されました' };
        }

        // 考えた過程（thinkingブロック）を除き、テキストの返答だけを読む
        const text = (data.content || []).filter(block => block.type === 'text').map(block => block.text).join('');
        const minutes = parseMinutes(text);
        return minutes ? { minutes, model: data.model || model } : { error: '数値を読み取れませんでした' };
      } catch (err) {
        console.error('通信エラー (Claude):', err);
        return { error: '通信エラー' };
      }
    }

    // ---------- 共通ヘルパー ----------
    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function formatHM(date) {
      return `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
    }

    function formatDateTime(date) {
      return `${date.getMonth() + 1}月${date.getDate()}日 ${formatHM(date)}`;
    }

    function formatDateHeading(date) {
      return `${date.getMonth() + 1}月${date.getDate()}日（${WEEKDAYS[date.getDay()]}）`;
    }

    // 締切の表示（今日 / 明日 / 月/日）
    function formatDeadline(date, now) {
      const tomorrow = new Date(now);
      tomorrow.setDate(tomorrow.getDate() + 1);
      if (date.toDateString() === now.toDateString()) return `今日 ${formatHM(date)}`;
      if (date.toDateString() === tomorrow.toDateString()) return `明日 ${formatHM(date)}`;
      return `${date.getMonth() + 1}/${date.getDate()} ${formatHM(date)}`;
    }

    // 分数を「〇時間〇分」に整形
    function formatMinutes(totalMinutes) {
      const m = Math.round(totalMinutes);
      const hours = Math.floor(m / 60);
      const mins = m % 60;
      if (hours === 0) return `${mins}分`;
      return mins > 0 ? `${hours}時間${mins}分` : `${hours}時間`;
    }

    // 締切までの余裕を「〇日〇時間」「〇時間〇分」に整形
    function formatMargin(totalMinutes) {
      const m = Math.round(totalMinutes);
      if (m >= 1440) return `${Math.floor(m / 1440)}日${Math.floor((m % 1440) / 60)}時間`;
      return formatMinutes(m);
    }

    // 締切までの残り時間（カウントダウン）
    function formatCountdown(diffMs) {
      if (diffMs <= 0) return '期限切れ';
      return formatMargin(Math.floor(diffMs / (1000 * 60)));
    }

    // 切迫度（残り時間 ÷ 所要時間）。小さいほど優先
    function urgencyRatio(task, now) {
      const diffMinutes = (new Date(task.datetime) - now) / (1000 * 60);
      return diffMinutes / (task.estimatedMinutes || 60);
    }

    // 危険度の判定： red（🚨）/ yellow（⚠️）/ green
    function urgencyLevel(task, now) {
      const diffMs = new Date(task.datetime) - now;
      if (diffMs <= 0) return 'red';
      const diffHours = diffMs / (1000 * 60 * 60);
      const ratio = urgencyRatio(task, now);
      if (ratio < 2.0 || diffHours < 12) return 'red';
      if (ratio < 5.0 || diffHours < 36) return 'yellow';
      return 'green';
    }

    // バイトの開始・終了日時（終了時刻が未登録なら開始＋4時間）
    function getJobRange(job) {
      const start = new Date(job.datetime);
      let end;
      if (job.endTime) {
        const [h, m] = job.endTime.split(':').map(Number);
        end = new Date(start);
        end.setHours(h, m, 0, 0);
        if (end <= start) end.setDate(end.getDate() + 1); // 日付をまたぐシフト
      } else {
        end = new Date(start.getTime() + DEFAULT_JOB_HOURS * 3600 * 1000);
      }
      return { start, end };
    }

    function formatJobRange(job, separator = ' – ') {
      const { start, end } = getJobRange(job);
      return `${formatHM(start)}${separator}${formatHM(end)}`;
    }

    function jobsOn(date) {
      const dayStr = date.toDateString();
      return tasks
        .filter(t => t.type === 'job' && new Date(t.datetime).toDateString() === dayStr)
        .sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
    }

    // ---------- タブ1：リスト ----------
    function updateJobSection(now) {
      const tomorrow = new Date(now);
      tomorrow.setDate(tomorrow.getDate() + 1);
      const todayJobs = jobsOn(now);
      const tomorrowJobs = jobsOn(tomorrow);

      const timeEl = document.getElementById('today-job-time');
      const nameEl = document.getElementById('today-job-name');

        statusEl.classList.remove('none');
        timeEl.textContent = todayJobs.map(j => formatJobRange(j)).join(' / ');
        nameEl.textContent = todayJobs.map(j => j.name).join(' / ');
      } else {
        statusEl.textContent = 'なし';
        statusEl.classList.add('none');
        timeEl.textContent = '';
        nameEl.textContent = '';

      document.getElementById('tomorrow-job-status').textContent =
        tomorrowJobs.length > 0 ? `あり ${tomorrowJobs.map(j => formatJobRange(j)).join(' / ')}` : 'なし';
    }

    // 今後のアルバイト一覧（終了前のものだけ表示。終わったバイトは分析用に記録として残す）
    let jobListOpen = false;

    function renderJobList(now) {

        .filter(t => t.type === 'job' && getJobRange(t).end > now)

    // 未完了課題の件数・残り合計時間
    function updateSummary(activeTasks) {
      const totalMinutes = activeTasks.reduce((sum, t) => sum + (t.estimatedMinutes || 60), 0);
      const hours = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;

      document.getElementById('summary-time').innerHTML = hours === 0
        ? `${mins}<small>分</small>`
        : `${hours}<small>時間</small>${mins > 0 ? `${mins}<small>分</small>` : ''}`;
    }

    function renderTaskList(activeTasks, now) {
      const taskListEl = document.getElementById('task-list');

      if (activeTasks.length === 0) {
        taskListEl.innerHTML = '<div class="empty-message">未完了の課題はありません 🎉</div>';
        return;
      }

      taskListEl.innerHTML = activeTasks.map(task => {
        const targetDate = new Date(task.datetime);
        const level = urgencyLevel(task, now);
        const estMinutes = task.estimatedMinutes || 60;
        const countdownText = formatCountdown(targetDate - now);

        return `
          <div class="task-row">
            <input type="checkbox" class="task-checkbox" onchange="toggleComplete(${task.id})" aria-label="完了にする">
            <div class="task-body">
              <div class="task-name">${escapeHtml(task.name)}</div>
              ${task.detail ? `<div class="task-detail">${escapeHtml(task.detail)}</div>` : ''}
              <div class="task-meta"><span class="dot bg-${level}"></span>${formatDeadline(targetDate, now)} 締切 ・ 約${estMinutes}分</div>
            </div>
            <div class="task-side">
              <div class="count-num c-${level}">${countdownText}</div>
              <div class="count-unit">${targetDate > now ? '残り' : ''}<button class="delete-btn" onclick="deleteTask(${task.id})" aria-label="削除">✕</button></div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 完了済み課題の折りたたみ表示（60秒ごとの再描画でも開閉状態を保つ）
    let completedSectionOpen = false;

    function renderCompletedSection(completedTasks) {
      const containerEl = document.getElementById('completed-container');
      if (completedTasks.length === 0) {
        containerEl.innerHTML = '';
        return;
      }

      const sorted = [...completedTasks].sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
      const rowsHtml = sorted.map(task => {
        let completedText = '';
        if (task.completedAt) {
          const completedDate = new Date(task.completedAt);
          const marginMinutes = (new Date(task.datetime) - completedDate) / (1000 * 60);
          const marginText = marginMinutes >= 0
            ? `締切の${formatMargin(marginMinutes)}前`
            : `締切を${formatMargin(-marginMinutes)}超過`;
          completedText = `完了: ${formatDateTime(completedDate)}（${marginText}）`;
        }

        return `
          <div class="task-row completed-row">
            <input type="checkbox" class="task-checkbox" checked onchange="toggleComplete(${task.id})" aria-label="未完了に戻す">
            <div class="task-body">
              <div class="task-name">${escapeHtml(task.name)}</div>
              <div class="completed-meta">${completedText}</div>
            </div>
            <button class="delete-btn" onclick="deleteTask(${task.id})" aria-label="削除">✕</button>
          </div>
        `;
      }).join('');

      containerEl.innerHTML = `
        <details class="completed-section" id="completed-details" ${completedSectionOpen ? 'open' : ''}>
          <summary>完了済み ${completedTasks.length}件</summary>
          <div>${rowsHtml}</div>
        </details>
      `;
      document.getElementById('completed-details').addEventListener('toggle', e => {
        completedSectionOpen = e.target.open;
      });
    }

    // ---------- タブ2：タイムライン ----------
    // 今日の空き時間に、優先度の高い課題（🚨・⚠️）を前から順に詰めて配置する
    function planToday(activeTasks, now, dayEnd) {
      const jobRanges = tasks
        .filter(t => t.type === 'job')
        .map(getJobRange)
        .filter(r => r.end > now && r.start < dayEnd);

      // バイト前後の移動時間も含めて「埋まっている時間」とする
      const busy = jobRanges
        .map(r => [r.start.getTime() - MOVE_BUFFER_MIN * 60000, r.end.getTime() + MOVE_BUFFER_MIN * 60000])
        .sort((a, b) => a[0] - b[0]);

      // 次の15分刻みから計画を始める
      const quarter = 15 * 60000;
      let cursor = Math.ceil(now.getTime() / quarter) * quarter;
      const slots = [];
      for (const [bs, be] of busy) {
        if (bs > cursor) slots.push({ start: cursor, end: Math.min(bs, dayEnd.getTime()) });
        cursor = Math.max(cursor, be);
      }
      if (cursor < dayEnd.getTime()) slots.push({ start: cursor, end: dayEnd.getTime() });

      const blocks = [];
      const shortage = [];
      const later = [];

      for (const task of activeTasks) {
        const level = urgencyLevel(task, now);
        if (level === 'green') {
          later.push(task);
          continue;
        }

        const deadline = new Date(task.datetime).getTime();
        let remaining = (task.estimatedMinutes || 60) * 60000;
        const parts = [];

        for (const slot of slots) {
          if (remaining <= 0) break;
          // 締切を過ぎている課題は今日中にとにかく片付ける
          const limit = deadline > now.getTime() ? Math.min(slot.end, deadline) : slot.end;
          const usable = limit - slot.start;
          if (usable < MIN_CHUNK_MIN * 60000) continue;
          const take = Math.min(usable, remaining);
          parts.push({ start: slot.start, end: slot.start + take });
          slot.start += take + TASK_GAP_MIN * 60000;
          remaining -= take;
        }

        parts.forEach((p, i) => blocks.push({
          task, level,
          start: new Date(p.start),
          end: new Date(p.end),
          partLabel: parts.length > 1 ? `（${i + 1}/${parts.length}）` : ''
        }));

        if (remaining > 0) shortage.push({ task, minutes: Math.round(remaining / 60000) });
      }

      return { jobRanges, blocks, shortage, later };
    }

    function renderTimeline(activeTasks, now) {
      const tomorrow = new Date(now);
      tomorrow.setDate(tomorrow.getDate() + 1);
      const todayJobs = jobsOn(now);
      const tomorrowJobs = jobsOn(tomorrow);
      const totalMinutes = activeTasks.reduce((sum, t) => sum + (t.estimatedMinutes || 60), 0);

      document.getElementById('tl-date').textContent = formatDateHeading(now);
      document.getElementById('tl-pills').innerHTML = `
        ${todayJobs.length > 0
          ? todayJobs.map(j => `<span class="pill pill-job">バイト ${formatJobRange(j, '–')}</span>`).join('')
          : '<span class="pill pill-none">今日のバイト なし</span>'}
        <span class="pill pill-none">明日${tomorrowJobs.length > 0 ? 'あり' : 'なし'}</span>
        <span class="pill pill-sum">残り ${formatMinutes(totalMinutes)}</span>
      `;

      // 表示範囲：いまの時刻（正時）〜 24:00
      const tlStart = new Date(now);
      tlStart.setMinutes(0, 0, 0);
      const dayEnd = new Date(now);
      dayEnd.setHours(24, 0, 0, 0);
      const hours = Math.round((dayEnd - tlStart) / 3600000);
      const toY = t => ((t - tlStart) / 3600000) * HOUR_PX;
      const clip = t => new Date(Math.min(Math.max(t, tlStart), dayEnd));

      const { jobRanges, blocks, shortage, later } = planToday(activeTasks, now, dayEnd);

      let html = '';
      for (let h = 0; h <= hours; h++) {
        html += `<div class="tl-hour" style="top:${h * HOUR_PX}px"><span>${pad2((tlStart.getHours() + h) % 24 || (h > 0 ? 24 : 0))}:00</span></div>`;
      }

      const block = (cls, start, end, title, sub) => {
        const s = clip(start), e = clip(end);
        if (e <= s) return '';
        const top = toY(s);
        const height = Math.max(toY(e) - top, 16);
        const compact = height < 44;
        return `<div class="tl-block ${cls}${compact ? ' compact' : ''}" style="top:${top}px; height:${height}px;">
          <b>${title}</b>${sub ? `<span>${sub}</span>` : ''}
        </div>`;
      };

      jobRanges.forEach(r => {
        const job = tasks.find(t => t.type === 'job' && new Date(t.datetime).getTime() === r.start.getTime());
        const moveMs = MOVE_BUFFER_MIN * 60000;
        html += block('b-move', new Date(r.start - moveMs), r.start, '移動', '');
        html += block('b-job', r.start, r.end, `アルバイト${job ? `（${escapeHtml(job.name)}）` : ''}`, `${formatHM(r.start)}–${formatHM(r.end)}`);
        html += block('b-move', r.end, new Date(r.end.getTime() + moveMs), '移動', '');
      });

      blocks.forEach(b => {
        html += block(`b-${b.level}`, b.start, b.end,
          `${escapeHtml(b.task.name)}${b.partLabel}`,
          `${formatHM(b.start)}–${formatHM(b.end)} ・ ${Math.round((b.end - b.start) / 60000)}分`);
      });

      // 今日が締切の課題に締切ラインを引く
      activeTasks.forEach(task => {
        const d = new Date(task.datetime);
        if (d > now && d <= dayEnd) {
          html += `<div class="tl-deadline" style="top:${toY(d)}px"><span>${escapeHtml(task.name)} 締切 ${formatHM(d)}</span></div>`;
        }
      });

      html += `<div class="tl-now" style="top:${toY(now)}px"><span>いま ${formatHM(now)}</span></div>`;

      const gridEl = document.getElementById('tl-grid');
      gridEl.style.height = `${hours * HOUR_PX}px`;
      gridEl.innerHTML = html;

      // 時間が足りない課題・今日やらなくてよい課題
      let extra = '';
      if (shortage.length > 0) {
        extra += `<div class="tl-card"><div class="tl-card-title warn">⚠️ 今日の空き時間では足りません</div>
          ${shortage.map(s => `<div class="tl-card-row"><span>${escapeHtml(s.task.name)}</span><span class="c-red">あと${formatMinutes(s.minutes)}不足</span></div>`).join('')}
        </div>`;
      }
      if (later.length > 0) {
        extra += `<div class="tl-card"><div class="tl-card-title">今日やらなくてOK</div>
          ${later.map(t => `<div class="tl-card-row"><span>${escapeHtml(t.name)}（約${t.estimatedMinutes || 60}分）</span><span class="c-green">あと${formatCountdown(new Date(t.datetime) - now)}</span></div>`).join('')}
        </div>`;
      }
      if (activeTasks.length === 0) {
        extra += '<div class="tl-card"><div class="tl-card-title">未完了の課題はありません 🎉</div></div>';
      }
      document.getElementById('tl-extra').innerHTML = extra;
    }

    // ---------- 全体の再描画 ----------
    function renderTasks() {
      const now = new Date();
      const activeTasks = tasks
        .filter(t => t.type === 'task' && !t.completed)
        .sort((a, b) => urgencyRatio(a, now) - urgencyRatio(b, now));
      const completedTasks = tasks.filter(t => t.type === 'task' && t.completed);

      document.getElementById('list-date').textContent = formatDateHeading(now);
      updateJobSection(now);
      renderJobList(now);
      updateSummary(activeTasks);
      renderTaskList(activeTasks, now);
      renderCompletedSection(completedTasks);
      renderTimeline(activeTasks, now);
    }

    document.getElementById('add-schedule-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = '登録中...';

      const name = document.getElementById('task-name').value;
      const type = document.getElementById('task-type').value;
      const detail = document.getElementById('task-detail').value;
      const manualMinutes = document.getElementById('task-manual-minutes').value;
      const datetime = document.getElementById('task-datetime').value;
      const endTime = document.getElementById('job-end-time').value;

      let estimatedMinutes = 60;
      if (type === 'task') {
        estimatedMinutes = await estimateTaskMinutes(name, detail, manualMinutes);
      } else {
        showStatus(`アルバイト（${name}）を登録しました`, "info");
      }

      const newTask = normalizeTask({
        id: Date.now(),
        name,
        type,
        detail,
        datetime,
        estimatedMinutes,
        createdAt: new Date().toISOString(),
        ...(type === 'job' && endTime ? { endTime } : {})
      });

      tasks.push(newTask);
      saveTasks();
      renderTasks();

      this.reset();
      toggleJobTimeInput();
      submitBtn.disabled = false;
      submitBtn.textContent = '登録する';
      closeSheet();
    });

    // 完了 ⇔ 未完了の切り替え（完了日時を記録する）
    function toggleComplete(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.completed = !task.completed;
      task.completedAt = task.completed ? new Date().toISOString() : null;
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      const target = tasks.find(t => t.id === id);
      // カレンダーから取り込んだ予定は、次の同期で復活しないように記録しておく
      if (target && target.source === 'gcal') {
        const hiddenIds = loadGcalHiddenIds();
        hiddenIds.push(target.externalId);
        localStorage.setItem(GCAL_HIDDEN_STORAGE, JSON.stringify(hiddenIds));
        showStatus('📅 この予定は今後の同期でも取り込みません', 'info');
      }
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    // ---------- Googleカレンダー連携（Apps Script のウェブアプリから取得） ----------
    let gcalLastError = '';

    function loadGcalHiddenIds() {
      try {
        const parsed = JSON.parse(localStorage.getItem(GCAL_HIDDEN_STORAGE) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function updateGcalStatus() {
      const statusEl = document.getElementById('gcal-status');
      const lastSync = localStorage.getItem(GCAL_LAST_SYNC_STORAGE);
      if (!localStorage.getItem(GCAL_URL_STORAGE)) {
        statusEl.textContent = '未設定';
      } else if (gcalLastError) {
        statusEl.textContent = `⚠️ ${gcalLastError}`;
      } else {
        statusEl.textContent = lastSync ? `前回の同期: ${formatDateTime(new Date(lastSync))}` : '未同期';
      }
    }

    function saveGcalUrl() {
      const url = document.getElementById('gcal-url').value.trim();
      if (!url) {
        localStorage.removeItem(GCAL_URL_STORAGE);
        updateGcalStatus();
        return;
      }
      if (!url.startsWith('https://script.google.com/')) {
        showStatus('📅 https://script.google.com/ で始まるURLを入力してください', 'error');
        return;
      }
      localStorage.setItem(GCAL_URL_STORAGE, url);
      syncGoogleCalendar(true);
    }

    function eventToJobFields(event) {
      return {
        name: event.title,
        datetime: toLocalInputValue(new Date(event.start)),
        endTime: formatHM(new Date(event.end))
      };
    }

    // 取得した予定をアルバイトとして追加・更新・削除する（手入力のバイトには触れない）
    function applyCalendarEvents(data) {
      const hiddenIds = new Set(loadGcalHiddenIds());
      const rangeFrom = new Date(data.from).getTime();
      const rangeTo = new Date(data.to).getTime();
      const incoming = new Map(data.events.filter(e => !hiddenIds.has(e.id)).map(e => [e.id, e]));
      let added = 0, updated = 0, removed = 0;

      tasks = tasks.filter(t => {
        if (t.source !== 'gcal') return true;
        const event = incoming.get(t.externalId);
        if (event) {
          const fields = eventToJobFields(event);
          if (fields.name !== t.name || fields.datetime !== t.datetime || fields.endTime !== t.endTime) {
            Object.assign(t, fields);
            updated++;
          }
          incoming.delete(t.externalId);
          return true;
        }
        // 取得範囲内なのにカレンダーから消えた予定は削除（範囲外の過去分は記録として残す）
        const start = new Date(t.datetime).getTime();
        if (start >= rangeFrom && start <= rangeTo) {
          removed++;
          return false;
        }
        return true;
      });

      let nextId = Date.now();
      incoming.forEach(event => {
        while (tasks.some(t => t.id === nextId)) nextId++;
        tasks.push(normalizeTask({
          id: nextId,
          type: 'job',
          detail: '',
          estimatedMinutes: 60,
          source: 'gcal',
          externalId: event.id,
          createdAt: new Date().toISOString(),
          ...eventToJobFields(event)
        }));
        added++;
      });

      if (added + updated + removed > 0) {
        saveTasks();
        renderTasks();
      }
      return { added, updated, removed };
    }

    async function syncGoogleCalendar(manual = false) {
      const url = localStorage.getItem(GCAL_URL_STORAGE);
      if (!url) {
        if (manual) showStatus('📅 先に Apps Script のURLを入力してください', 'error');
        return;
      }

      try {
        // 追加ヘッダーを付けない単純なGETにする（Apps Script はこの形でしか他サイトから読めない）
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        if (!Array.isArray(data.events)) throw new Error('予定の形式が正しくありません');

        const result = applyCalendarEvents(data);
        gcalLastError = '';
        localStorage.setItem(GCAL_LAST_SYNC_STORAGE, new Date().toISOString());
        if (manual || result.added + result.updated + result.removed > 0) {
          showStatus(`📅 同期しました（追加 ${result.added}件・更新 ${result.updated}件・削除 ${result.removed}件）`, 'info');
        }
      } catch (err) {
        console.error('Googleカレンダー同期エラー:', err);
        gcalLastError = '同期に失敗しました（URLと公開設定「全員」を確認）';
        if (manual) showStatus(`📅 ${gcalLastError}`, 'error');
      }
      updateGcalStatus();
    }

    function loadGcalSettings() {
      document.getElementById('gcal-url').value = localStorage.getItem(GCAL_URL_STORAGE) || '';
      updateGcalStatus();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    renderTasks();
    setInterval(renderTasks, 60000);

    // 起動時・30分ごと・アプリに戻ってきたとき（前回から10分以上たっていれば）にカレンダーを同期
    loadGcalSettings();
    syncGoogleCalendar();
    setInterval(syncGoogleCalendar, GCAL_SYNC_INTERVAL_MIN * 60000);
    document.addEventListener('visibilitychange', () => {
      const lastSync = new Date(localStorage.getItem(GCAL_LAST_SYNC_STORAGE) || 0).getTime();
      if (document.visibilityState === 'visible' && Date.now() - lastSync > 10 * 60000) {
        syncGoogleCalendar();
      }
    });
  </script>
</body>
</html>
