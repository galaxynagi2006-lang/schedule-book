<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>デザイン案 比較</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1760px; height: 1080px; overflow: hidden;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    background: #e9ebf0; color: #111827; padding: 36px 40px;
  }
  h1 { font-size: 26px; font-weight: 800; }
  .sub { font-size: 14px; color: #6b7280; margin-top: 4px; }
  .row { display: flex; gap: 40px; margin-top: 26px; }
  .item { width: 390px; }
  .phone { width: 390px; height: 844px; border-radius: 36px; overflow: hidden; box-shadow: 0 0 0 8px #111827, 0 20px 40px rgba(0,0,0,0.2); }
  .phone img { width: 390px; height: 844px; display: block; }
  .name { font-size: 18px; font-weight: 800; margin-top: 24px; }
  .desc { font-size: 13px; color: #4b5563; margin-top: 4px; }
</style>
</head>
<body>
  <h1>スマートスケジュール帳 デザイン案</h1>
  <div class="sub">同じデータ（バイト 18:00–22:00 / 課題3件）で4つの方向性を比較</div>
  <div class="row">
    <div class="item"><div class="phone"><img src="a-minimal.png"></div><div class="name">案A クリーン・ミニマル</div><div class="desc">白地＋大きな数字。情報を絞って1秒で読める</div></div>
    <div class="item"><div class="phone"><img src="b-night.png"></div><div class="name">案B ナイト・ダーク</div><div class="desc">就寝前に目に優しい。切迫度をバーで可視化</div></div>
    <div class="item"><div class="phone"><img src="c-timeline.png"></div><div class="name">案C タイムライン型</div><div class="desc">バイトの前後のスキマ時間に課題を配置</div></div>
    <div class="item"><div class="phone"><img src="d-pop.png"></div><div class="name">案D ポップ・ブロック</div><div class="desc">太線と原色で強く主張。残り時間が目に飛び込む</div></div>
  </div>
</body>
</html>
