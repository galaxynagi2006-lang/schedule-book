<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>ロゴ案 比較</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1600px; height: 760px; overflow: hidden; background: #e9ebf0; color: #111827; padding: 40px;
         font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; }
  h1 { font-size: 26px; font-weight: 800; }
  .sub { font-size: 14px; color: #6b7280; margin-top: 4px; }
  .row { display: flex; gap: 32px; margin-top: 30px; }
  .item { width: 352px; background: #fff; border-radius: 20px; padding: 24px; }
  .big { width: 304px; height: 304px; display: block; }
  .small { display: flex; align-items: flex-end; gap: 14px; margin-top: 18px; }
  .small img:nth-child(1) { width: 64px; height: 64px; }
  .small img:nth-child(2) { width: 32px; height: 32px; }
  .small span { font-size: 11px; color: #9ca3af; }
  .name { font-size: 17px; font-weight: 800; margin-top: 14px; }
  .desc { font-size: 13px; color: #4b5563; margin-top: 4px; line-height: 1.5; }
</style></head><body>
  <h1>スマートスケジュール帳 ロゴ案</h1>
  <div class="sub">アプリの配色（青 #2563eb・授業の緑・締切の赤）を使用。下段は実際のアイコンサイズ（64px / 32px）</div>
  <div class="row">
    <div class="item"><img class="big" src="logo-1-clock-check.svg"><div class="small"><img src="logo-1-clock-check.svg"><img src="logo-1-clock-check.svg"><span>64 / 32px</span></div><div class="name">案1 時計 × チェック</div><div class="desc">時計の針がチェックマーク。「残り時間」と「完了」を1つの形で表す</div></div>
    <div class="item"><img class="big" src="logo-2-calendar-bolt.svg"><div class="small"><img src="logo-2-calendar-bolt.svg"><img src="logo-2-calendar-bolt.svg"><span>64 / 32px</span></div><div class="name">案2 カレンダー × 稲妻</div><div class="desc">予定を「1秒で把握」できるスピード感</div></div>
    <div class="item"><img class="big" src="logo-3-timeline.svg"><div class="small"><img src="logo-3-timeline.svg"><img src="logo-3-timeline.svg"><span>64 / 32px</span></div><div class="name">案3 タイムライン</div><div class="desc">授業（緑）・バイト（青）・課題（赤）が並ぶ1日。アプリのタイムライン画面そのもの</div></div>
    <div class="item"><img class="big" src="logo-4-urgency-ring.svg"><div class="small"><img src="logo-4-urgency-ring.svg"><img src="logo-4-urgency-ring.svg"><span>64 / 32px</span></div><div class="name">案4 切迫度リング</div><div class="desc">緑→黄→赤で締切が近づく様子と完了のチェック。アプリの危険度判定を表す</div></div>
  </div>
</body></html>
