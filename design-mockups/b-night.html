<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>案B ナイト・ダーク</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 390px; height: 844px; overflow: hidden;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    background: radial-gradient(120% 60% at 50% 0%, #1e1b4b 0%, #0b1020 60%);
    color: #e5e7eb;
    font-variant-numeric: tabular-nums;
    position: relative;
  }
  .wrap { padding: 50px 18px 0; display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .date { font-size: 14px; color: #a5b4fc; font-weight: 600; }
  .moon { font-size: 13px; color: #94a3b8; background: rgba(255,255,255,0.06); padding: 5px 10px; border-radius: 999px; }

  .hero {
    border-radius: 22px; padding: 22px 20px;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    box-shadow: 0 12px 30px rgba(124, 58, 237, 0.35);
  }
  .hero-label { font-size: 12px; color: #c7d2fe; font-weight: 600; letter-spacing: 0.08em; }
  .hero-main { font-size: 40px; font-weight: 800; color: #fff; margin-top: 4px; line-height: 1.1; }
  .hero-time { font-size: 18px; font-weight: 700; color: #e0e7ff; margin-top: 4px; }
  .hero-foot { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.2); font-size: 13px; color: #c7d2fe; }
  .hero-foot b { color: #fff; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 12px 14px; }
  .stat-num { font-size: 22px; font-weight: 800; color: #fff; }
  .stat-num small { font-size: 12px; color: #94a3b8; font-weight: 600; }
  .stat-label { font-size: 11px; color: #94a3b8; margin-top: 2px; }

  .sec { font-size: 13px; font-weight: 700; color: #94a3b8; margin-top: 4px; }

  .task {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 14px 14px 12px 16px; position: relative; overflow: hidden;
  }
  .task::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); box-shadow: 0 0 14px var(--c); }
  .t-head { display: flex; gap: 12px; align-items: flex-start; }
  .check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #475569; flex-shrink: 0; margin-top: 1px; }
  .t-body { flex: 1; }
  .t-name { font-size: 15px; font-weight: 700; color: #f8fafc; }
  .t-meta { font-size: 12px; color: #94a3b8; margin-top: 3px; }
  .t-count { font-size: 14px; font-weight: 800; color: var(--c); white-space: nowrap; }
  .bar { height: 5px; border-radius: 99px; background: rgba(255,255,255,0.08); margin-top: 10px; margin-left: 32px; }
  .bar span { display: block; height: 100%; border-radius: 99px; background: var(--c); }
  .bar-label { font-size: 10px; color: #64748b; margin-left: 32px; margin-top: 4px; }

  .fab {
    position: absolute; left: 18px; right: 18px; bottom: 30px; height: 52px;
    border-radius: 16px; background: #f8fafc; color: #0b1020;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 15px; font-weight: 800;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <span class="date">10月20日（火）</span>
      <span class="moon">🌙 夜モード</span>
    </div>

    <div class="hero">
      <div class="hero-label">本日のアルバイト</div>
      <div class="hero-main">あり</div>
      <div class="hero-time">18:00 – 22:00 ・ カフェ</div>
      <div class="hero-foot"><span>明日のアルバイト</span><b>なし</b></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-num">3 <small>件</small></div><div class="stat-label">未完了の課題</div></div>
      <div class="stat"><div class="stat-num">3<small>時間</small>45<small>分</small></div><div class="stat-label">残り作業の合計</div></div>
    </div>

    <div class="sec">いまやるべき順</div>

    <div class="task" style="--c:#f87171">
      <div class="t-head">
        <div class="check"></div>
        <div class="t-body">
          <div class="t-name">知能メディアレポート</div>
          <div class="t-meta">今日 23:59 締切 ・ 約120分</div>
        </div>
        <div class="t-count">🚨 8時間31分</div>
      </div>
      <div class="bar"><span style="width:78%"></span></div>
      <div class="bar-label">切迫度 高 ・ バイト前に着手推奨</div>
    </div>

    <div class="task" style="--c:#fbbf24">
      <div class="t-head">
        <div class="check"></div>
        <div class="t-body">
          <div class="t-name">プログラミング演習課題</div>
          <div class="t-meta">10/22 10:40 締切 ・ 約45分</div>
        </div>
        <div class="t-count">1日19時間</div>
      </div>
      <div class="bar"><span style="width:40%"></span></div>
    </div>

    <div class="task" style="--c:#34d399">
      <div class="t-head">
        <div class="check"></div>
        <div class="t-body">
          <div class="t-name">英語 小テスト対策</div>
          <div class="t-meta">10/24 09:00 締切 ・ 約60分</div>
        </div>
        <div class="t-count">3日21時間</div>
      </div>
      <div class="bar"><span style="width:15%"></span></div>
    </div>
  </div>
  <div class="fab">＋ 予定・課題を追加</div>
</body>
</html>
